version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: ecommerce_db
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/ecommerce_db
      SPRING_DATASOURCE_USERNAME: ecommerce
      SPRING_DATASOURCE_PASSWORD: secret
    depends_on:
      - db
      - redis

  frontend-admin:
    build: ./frontend/admin
    ports:
      - "3000:3000"
    depends_on:
      - backend

  frontend-customer:
    build: ./frontend/customer
    ports:
      - "3001:3001"
    depends_on:
      - backend